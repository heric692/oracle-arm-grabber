name: Oracle ARM 自動搶機器

"on":
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分鐘自動執行
  workflow_dispatch:           # 也可以手動觸發

jobs:
  grab:
    runs-on: ubuntu-latest

    steps:
      - name: 安裝 OCI CLI
        run: pip install oci-cli --quiet

      - name: 設定 OCI 憑證
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=us-ashburn-1
          key_file=/home/runner/.oci/key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem

      - name: 查詢 Ubuntu 22.04 ARM 映像 OCID
        id: get_image
        run: |
          IMAGE=$(oci compute image list \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "22.04" \
            --shape VM.Standard.A1.Flex \
            --all \
            --query "sort_by(data, &\"time-created\")[-1].id" \
            --raw-output)
          echo "image_id=$IMAGE" >> $GITHUB_OUTPUT
          echo "找到映像：$IMAGE"

      - name: 嘗試三個 AD 搶執行個體
        id: create
        run: |
          SUCCESS=false
          for AD in "OfZq:US-ASHBURN-AD-1" "OfZq:US-ASHBURN-AD-2" "OfZq:US-ASHBURN-AD-3"; do
            echo "正在嘗試 $AD ..."
            RESULT=$(oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --image-id "${{ steps.get_image.outputs.image_id }}" \
              --subnet-id "${{ secrets.OCI_SUBNET_OCID }}" \
              --assign-public-ip true \
              --display-name "n8n-server" \
              --ssh-authorized-keys-file <(echo "${{ secrets.SSH_PUBLIC_KEY }}") \
              2>&1) || true

            if echo "$RESULT" | grep -q '"lifecycle-state"'; then
              echo "🎉 成功！在 $AD 搶到執行個體！"
              SUCCESS=true
              break
            else
              echo "$AD 容量不足，繼續嘗試..."
            fi
          done

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          if [ "$SUCCESS" = "false" ]; then
            echo "三個 AD 都滿了，15 分鐘後再試。"
          fi

      - name: 搶到時發 GitHub 通知
        if: steps.create.outputs.success == 'true'
        run: |
          echo "::notice::🎉 Oracle ARM 執行個體搶到了！請立刻登入 Oracle Console 確認！"
          exit 0
